# Regénère les pages recettes, les listes et le sitemap quand les recettes ou leurs photos changent.
name: Générer les pages recettes

on:
  push:
    branches: [main]
    paths:
      - data/recettes.json
      - images/recettes/**
      - scripts/generer_recettes.py
      - .github/workflows/generer-recettes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generer-recettes
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer
        run: python3 scripts/generer_recettes.py
      - name: Enregistrer les changements
        run: |
          git add -A recettes sitemap.xml index.html recettes.html
          if git diff --cached --quiet; then
            echo "Rien à changer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regénère les pages recettes et le sitemap"
          git pull --rebase origin main
          git push origin HEAD:main
